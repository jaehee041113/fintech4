# 프로덕션 환경 (AWS EC2)
# 실행: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:

  mysql:
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports: []           # 프로덕션에서 MySQL 외부 포트 비노출
    expose:
      - "3306"

  backend:
    restart: always
    environment:
      dbid: root
      dbpw: ${MYSQL_ROOT_PASSWORD}
      host: mysql
      port: 3306
    ports: []           # nginx가 프록시하므로 외부 포트 비노출
    expose:
      - "8000"
    volumes: []         # 프로덕션에서 코드 마운트 제거
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2

  frontend:
    restart: always
    build:
      args:
        NEXT_PUBLIC_API_URL: ${DOMAIN_URL:-http://localhost}  # EC2 도메인 또는 IP
    ports: []
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: kb_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro      # SSL 인증서 (Let's Encrypt)
    depends_on:
      - backend
      - frontend
