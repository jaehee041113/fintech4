# 로컬 개발 환경
# 실행: docker-compose up --build

services:

  mysql:
    image: mysql:8.0
    container_name: kb_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: kb_cards
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kb_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      dbid: root
      dbpw: ${MYSQL_ROOT_PASSWORD}
      host: mysql
      port: 3306
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # 개발 시 코드 반영 (핫리로드)
      - /app/.venv              # venv 제외
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    container_name: kb_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql_data:
