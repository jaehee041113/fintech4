
services:
  db:
    image: mysql:8.0
    container_name: easyfin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: easyfin_db
      MYSQL_USER: easyfin
      MYSQL_PASSWORD: easyfin
      TZ: Asia/Seoul
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easyfin-backend
    environment:
      DATABASE_URL: mysql+pymysql://easyfin:easyfin@db:3306/easyfin_db
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"    # 호스트 8000 → 컨테이너 8000 (FastAPI API)
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: easyfin-frontend
    ports:
      - "3000:80"      # 호스트 3000 → 컨테이너 80 (nginx 정적 프론트)
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
